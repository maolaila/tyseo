<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pony · TDK 工作台</title>
<style>
:root{font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif;color:#172b40;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}
main{max-width:1180px;margin:auto;padding:28px}h1{font-size:27px;margin:0 0 8px}h2{font-size:18px;margin:0}.muted{color:#64758a;font-size:13px}
.panel{background:white;border:1px solid #dce4eb;border-radius:13px;margin:18px 0;min-width:0}.body{padding:20px}.head{padding:16px 20px;border-bottom:1px solid #dce4eb;display:flex;justify-content:space-between;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button{font:inherit;border:1px solid #ccd7e5;background:white;color:#172b40;border-radius:9px;padding:10px 15px;cursor:pointer}button.primary{background:#145bc7;border-color:#145bc7;color:white}button:disabled{opacity:.55;cursor:wait}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #90c1ff;outline-offset:2px}
.banner{padding:15px 18px;border-radius:10px;border:1px solid #eed6a5;background:#fff8e9;color:#714d12;overflow-wrap:anywhere}.banner.ok{background:#e9f6f0;border-color:#bcdccb;color:#146040}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #edf1f5;vertical-align:top}th{background:#f8fafc;color:#536478;font-weight:600}td:first-child{color:#8793a0;width:40px}.domain{font-weight:600;overflow-wrap:anywhere}.table-wrap{overflow:auto}details{max-width:460px}summary{cursor:pointer;color:#145bc7}details p{margin:6px 0 12px;overflow-wrap:anywhere}details strong{display:block;margin-top:8px}.badge{background:#eaf0f8;border-radius:5px;padding:3px 7px;font-size:12px;white-space:nowrap}
@media(max-width:620px){main{padding:16px}h1{font-size:24px}.head{padding:13px}table,tbody{display:block}thead{display:none}tbody tr{display:grid;grid-template-columns:28px minmax(0,1fr);border-bottom:1px solid #edf1f5;padding:11px}td{display:block;border:0;padding:2px;min-width:0}td:first-child{grid-row:1;grid-column:1}td:not(:first-child){grid-column:2}.actions button{flex:1 1 170px}}
</style></head><body>
<main><header><h1>Pony · TDK 工作台</h1><div class="muted" id="batch">正在读取批次…</div></header>
<div class="panel"><div class="body">
  <div id="banner" class="banner" role="status">正在读取本地资料。</div>
  <div class="actions"><button id="connect">打开 Google 表格登录窗口</button><button id="write" class="primary" disabled>确认写入本批 TDK</button></div>
  <div class="muted">仅填写本人对应行的模板、Title、Description、Keywords（E:H）。完成回读后，后续由你手动操作。</div>
</div></div>
<section class="panel"><div class="head"><h2>本批域名与 TDK</h2><span class="muted" id="count">—</span></div><div class="table-wrap"><table>
<thead><tr><th>#</th><th>域名</th><th>分配词</th><th>状态</th><th>文案</th></tr></thead>
<tbody id="rows"><tr><td colspan="5">正在加载…</td></tr></tbody></table></div></section>
<p class="muted">工作台不会定时监听、自动购买域名、打开上站后台或提交网站。</p>
</main>
<script>
let token='',revision='',busy=false;
const $=id=>document.getElementById(id);
function el(tag,value,cls){const x=document.createElement(tag);x.textContent=value||'';if(cls)x.className=cls;return x}
function setMessage(message,ok=false){$('banner').textContent=message;$('banner').className='banner'+(ok?' ok':'')}
async function refresh(){
  try{
    const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw Error('工作台连接失败');
    const state=await response.json();token=state.control_token;revision=state.revision;
    $('batch').textContent=state.business_date+' · '+state.batch_id;
    $('count').textContent=state.domains.filter(d=>d.tdk).length+' / '+state.expected_count+' 份文案';
    $('write').disabled=busy||!state.ready;
    if(!busy)setMessage(state.reason||(
      state.last_result?'已回读确认 '+state.last_result.domains_verified+' 个域名；本次只完成 TDK 表格填写。':
      '文案已准备好。核对下方内容后，可写入本人对应的上站表行。'),state.done);
    $('rows').replaceChildren(...state.domains.map((d,i)=>{
      const tr=el('tr');tr.append(el('td',i+1),el('td',d.domain,'domain'),el('td',d.keyword));
      tr.append(el('td',d.status==='sheet_filled'?'已填入':d.status==='awaiting_ai_tdk'?'待当次撰写':d.leo_review?.status==='approved'?'已按当次要求审核':'待写入','badge'));
      const cell=el('td');if(d.tdk){
        const details=el('details');details.append(el('summary','查看 TDK'));
        for(const [key,label] of [['template','模板'],['title','Title'],['description','Description'],['keywords','Keywords']])
          details.append(el('strong',label),el('p',d.tdk[key]||''));
        if(d.tdk.assignment)details.append(el('strong','当次分组'),el('p',d.tdk.assignment.group||''));
        cell.append(details);
      }else cell.textContent=d.reason||'等待 AI 按最新分组和竞品撰写';
      tr.append(cell);return tr;
    }));
  }catch(error){setMessage(error.message);$('write').disabled=true}
}
async function action(name){
  busy=true;$('connect').disabled=true;$('write').disabled=true;setMessage(name==='write_tdk'?'正在核对并写入本批 TDK，请勿重复点击。':'正在打开普通浏览器…');
  try{
    const response=await fetch('/api/control',{method:'POST',
      headers:{'Content-Type':'application/json','X-Workbench-Token':token},
      body:JSON.stringify({action:name,revision})});
    const result=await response.json();if(!response.ok)throw Error(result.error||'操作失败');
    await refresh();
    setMessage(name==='write_tdk'?'已写入并回读确认 '+result.domains_verified+' 个域名；后续请手动操作。':'表格窗口已打开；登录后再点写入。',name==='write_tdk');
  }catch(error){setMessage(error.message)}finally{busy=false;$('connect').disabled=false;await refresh()}
}
$('connect').onclick=()=>action('connect');$('write').onclick=()=>action('write_tdk');refresh();
</script></body></html>
